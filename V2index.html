<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Battlefield Supremacy V2</title><style>body{margin:0;overflow:hidden;background:black;font-family:Arial}#hud{position:absolute;top:10px;left:10px;color:white;background:rgba(0,0,0,.5);padding:12px;border-radius:10px;z-index:5}#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-size:28px;z-index:5}button{position:absolute;border:none;border-radius:50%;background:rgba(255,255,255,.2);color:white;font-size:22px;width:75px;height:75px}#up{bottom:190px;left:90px}#down{bottom:30px;left:90px}#left{bottom:110px;left:10px}#right{bottom:110px;left:170px}#shoot{bottom:110px;right:25px;background:rgba(255,0,0,.6);width:90px;height:90px}#reload{bottom:220px;right:40px;background:rgba(0,0,255,.5)}</style></head><body><div id="hud"><h2>Battlefield Supremacy V2</h2><div id="score"></div><div id="health"></div><div id="ammo"></div></div><div id="crosshair">+</div><button id="up">↑</button><button id="down">↓</button><button id="left">←</button><button id="right">→</button><button id="shoot">🔥</button><button id="reload">⟳</button><script type="module" src="game.js"></script></body></html>
